<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 44" width="150" height="44" role="img" aria-label="CVX">
  <defs>
    <radialGradient id="halo" cx="70%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="sharp-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Radial halo behind swoosh (mimics the glow bloom in original) -->
  <ellipse cx="104" cy="18" rx="46" ry="22" fill="url(#halo)" opacity="0.65"/>

  <!-- CVX bold text -->
  <text x="2" y="36"
        font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif"
        font-weight="900" font-size="34" letter-spacing="-1">
    <tspan fill="#111827">CV</tspan><tspan fill="#1e3a8a">X</tspan>
  </text>

  <!-- Orbital ring swoosh — 4 layers from wide+soft to narrow+bright -->
  <path d="M 50 36 C 58 6, 92 -4, 134 14 C 144 20, 142 33, 134 37"
        stroke="#0369a1" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.15"/>
  <path d="M 50 36 C 58 6, 92 -4, 134 14 C 144 20, 142 33, 134 37"
        stroke="#0ea5e9" stroke-width="9"  fill="none" stroke-linecap="round" opacity="0.30"/>
  <path d="M 50 36 C 58 6, 92 -4, 134 14 C 144 20, 142 33, 134 37"
        stroke="#38bdf8" stroke-width="4"  fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M 50 36 C 58 6, 92 -4, 134 14 C 144 20, 142 33, 134 37"
        stroke="#bae6fd" stroke-width="1.5" fill="none" stroke-linecap="round"
        filter="url(#sharp-glow)"/>
</svg>
